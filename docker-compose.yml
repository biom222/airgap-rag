x-app-environment: &app-environment
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://airgap:airgap@postgres:5432/airgap_rag
  DOCUMENT_STORAGE_PATH: /data/documents
  EMBEDDING_PROVIDER: mock
  LOG_LEVEL: INFO
  AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
  AUTH_PRINCIPALS_JSON: ${AUTH_PRINCIPALS_JSON:-[]}
  TRACING_ENABLED: ${TRACING_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318/v1/traces}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
  LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  RAG_CONTEXT_MAX_CHARACTERS: ${RAG_CONTEXT_MAX_CHARACTERS:-16000}
  CHAT_HISTORY_MAX_MESSAGES: ${CHAT_HISTORY_MAX_MESSAGES:-10}
  WORKER_METRICS_HOST: 0.0.0.0
  WORKER_METRICS_PORT: 9001
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
  RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-mock}
  RERANKER_MODEL_NAME_OR_PATH: ${RERANKER_MODEL_NAME_OR_PATH:-models/rerankers/bge-reranker-v2-m3}
  RERANKER_TOP_N: ${RERANKER_TOP_N:-5}
  RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-16}
  RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
  QDRANT_URL: http://qdrant:6333
  REDIS_URL: redis://redis:6379/0

services:
  api:
    build:
      context: .
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - document_data:/data/documents
    expose:
      - "9001"

  worker:
    build:
      context: .
    command:
      - taskiq
      - worker
      - airgap_rag.jobs.broker:broker
      - airgap_rag.jobs.tasks
      - --workers
      - "1"
      - --max-async-tasks
      - "1"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - document_data:/data/documents

  outbox:
    build:
      context: .
    command: ["python", "-m", "airgap_rag.jobs.outbox_worker"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
    command:
      - taskiq
      - scheduler
      - airgap_rag.jobs.broker:scheduler
      - --update-interval
      - "1"
    environment: *app-environment
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: airgap_rag
      POSTGRES_USER: airgap
      POSTGRES_PASSWORD: airgap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airgap -d airgap_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:8.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.12.11
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      alertmanager:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4318"

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  document_data:
  qdrant_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
