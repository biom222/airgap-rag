services:
  api:
    build:
      context: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://airgap:airgap@postgres:5432/airgap_rag
      DOCUMENT_STORAGE_PATH: /data/documents
      EMBEDDING_PROVIDER: mock
      LOG_LEVEL: INFO
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - document_data:/data/documents

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: airgap_rag
      POSTGRES_USER: airgap
      POSTGRES_PASSWORD: airgap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airgap -d airgap_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  document_data:
  qdrant_data:
