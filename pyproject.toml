[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "airgap-rag"
version = "0.1.0"
description = "Local RAG service for isolated environments"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "PyMuPDF>=1.25,<2",
    "pydantic-settings>=2.7,<3",
    "psutil>=6,<8",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.19,<1.20",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "taskiq>=0.13,<0.14",
    "taskiq-redis>=1.2.3,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pre-commit>=4,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
    "types-psutil>=6,<8",
]
embeddings = [
    "sentence-transformers>=5,<6",
]
reranking = [
    "sentence-transformers>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docx.*", "fitz.*", "sentence_transformers.*"]
ignore_missing_imports = true
